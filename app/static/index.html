<!doctype html>
<!--
  来源：公众号@小林coding
  后端八股网站：xiaolincoding.com
  Agent网站：xiaolinnote.com
  简历模版：jianli.xiaolinnote.com

<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>喵喵优选 · 智能客服</title>
  <script src="/static/auth.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect x='2' y='2' width='4' height='4' fill='%232b2632'/><rect x='10' y='2' width='4' height='4' fill='%232b2632'/><rect x='2' y='4' width='12' height='9' fill='%232b2632'/><rect x='3' y='3' width='2' height='3' fill='%23ff9f57'/><rect x='11' y='3' width='2' height='3' fill='%23ff9f57'/><rect x='3' y='5' width='10' height='7' fill='%23ff9f57'/><rect x='5' y='7' width='1' height='2' fill='%232b2632'/><rect x='10' y='7' width='1' height='2' fill='%232b2632'/><rect x='7' y='9' width='2' height='1' fill='%23ff8095'/></svg>" />
  <style>
    :root {
      --ink: #2b2632;
      --fur: #ff9f57;
      --coral: #ff7a59;
      --cream: #fff6e6;
      --paper: #fffaf0;
      --muted: #5a514a;
      --error: #d6455a;
      --online: #5fcf6a;
      --shadow: 4px 4px 0 var(--ink);
      --shadow-sm: 3px 3px 0 var(--ink);
      --shadow-lg: 8px 8px 0 var(--ink);
    }
    * { box-sizing: border-box; }
    img, svg { image-rendering: pixelated; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Consolas,
        "PingFang SC", "Microsoft YaHei", monospace;
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7d9a8;
      background-image:
        linear-gradient(rgba(43,38,50,0.05) 2px, transparent 2px),
        linear-gradient(90deg, rgba(43,38,50,0.05) 2px, transparent 2px);
      background-size: 24px 24px;
    }
    .app {
      width: 100%;
      max-width: 980px;
      height: 100dvh;
      display: flex;
      flex-direction: row;
      background: var(--cream);
      overflow: hidden;
    }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    @media (min-width: 780px) {
      .app {
        height: min(90dvh, 860px);
        border: 4px solid var(--ink);
        box-shadow: var(--shadow-lg);
      }
    }

    /* ---------- ch07:会话侧栏(多会话切换,验收长对话记忆用) ---------- */
    #sidebar {
      flex: none;
      width: 224px;
      display: flex;
      flex-direction: column;
      border-right: 4px solid var(--ink);
      background: var(--paper);
    }
    @media (max-width: 779px) { #sidebar { display: none; } }
    .sb-head {
      padding: 14px 12px;
      border-bottom: 4px solid var(--ink);
      background: var(--fur);
      font-weight: 700; font-size: 13px; letter-spacing: 1px;
    }
    #conv-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    #conv-list::-webkit-scrollbar { width: 10px; }
    #conv-list::-webkit-scrollbar-thumb { background: var(--fur); border: 2px solid var(--paper); }
    .conv-item {
      text-align: left;
      border: 3px solid var(--ink);
      background: var(--cream);
      padding: 8px 9px;
      cursor: pointer;
      font-family: inherit;
      color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform .06s steps(1), box-shadow .06s steps(1), background .06s;
    }
    .conv-item:hover { background: #ffedd6; }
    .conv-item:active { transform: translate(2px, 2px); box-shadow: none; }
    .conv-item.active { background: var(--fur); transform: translate(2px, 2px); box-shadow: none; }
    .conv-item .ci-top { font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .conv-item .ci-sum {
      font-size: 9px; font-weight: 700; color: #fff; background: var(--coral);
      border: 1px solid var(--ink); padding: 0 4px; letter-spacing: .5px;
    }
    .conv-item .ci-preview {
      font-size: 11px; color: var(--muted); margin-top: 3px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sb-empty { font-size: 11.5px; color: var(--muted); text-align: center; padding: 18px 6px; }

    /* ---------- header ---------- */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 4px solid var(--ink);
      background: var(--fur);
    }
    .avatar {
      flex: none;
      border: 3px solid var(--ink);
      background: var(--paper);
      box-shadow: var(--shadow-sm);
    }
    .avatar.lg { width: 46px; height: 46px; padding: 4px; }
    .avatar.sm { width: 34px; height: 34px; padding: 3px; box-shadow: 2px 2px 0 var(--ink); }
    .avatar svg { width: 100%; height: 100%; display: block; }
    .head-meta { display: flex; flex-direction: column; line-height: 1.35; }
    .head-meta .name { font-weight: 700; font-size: 15px; letter-spacing: .5px; }
    .head-meta .status { font-size: 11px; color: #6b5b48; display: flex; align-items: center; gap: 6px; }
    .dot-online { width: 8px; height: 8px; background: var(--online); border: 2px solid var(--ink); }
    header .spacer { flex: 1; }
    #new-chat {
      border: 3px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      padding: 8px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform .06s steps(1), box-shadow .06s steps(1);
    }
    #new-chat:hover { background: #fff; }
    #new-chat:active { transform: translate(3px, 3px); box-shadow: none; }

    /* ---------- messages ---------- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px 6px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #messages::-webkit-scrollbar { width: 12px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--fur); border: 3px solid var(--cream); }

    .row { display: flex; align-items: flex-end; gap: 10px; animation: pop .12s steps(2); }
    .row.user { justify-content: flex-end; }
    .row.bot { justify-content: flex-start; }
    @keyframes pop { from { transform: translateY(6px); } to { transform: translateY(0); } }

    .bubble {
      max-width: 74%;
      padding: 11px 14px;
      border: 3px solid var(--ink);
      line-height: 1.65;
      font-size: 14.5px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow-sm);
    }
    .row.bot .bubble { background: var(--paper); color: var(--ink); }
    .row.user .bubble { background: var(--coral); color: #fff; }
    .bubble.error { background: #ffe3e6; color: var(--error); }
    .tool-badges { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
    .tool-badges:empty { display: none; }
    .tool-badge {
      align-self: flex-start;
      font-size: 12px;
      color: var(--muted);
      background: rgba(0,0,0,.05);
      border: 1px dashed var(--muted);
      padding: 1px 7px;
      border-radius: 999px;
    }
    /* markdown 渲染(仅 bot 气泡文本区) */
    .bubble-text { white-space: normal; }
    .bubble-text > *:first-child { margin-top: 0; }
    .bubble-text > *:last-child { margin-bottom: 0; }
    .bubble-text p { margin: 0 0 8px; }
    .bubble-text h1, .bubble-text h2, .bubble-text h3,
    .bubble-text h4, .bubble-text h5, .bubble-text h6 {
      margin: 10px 0 6px; font-size: 15px; font-weight: 700;
    }
    .bubble-text ul, .bubble-text ol { margin: 6px 0; padding-left: 20px; }
    .bubble-text li { margin: 2px 0; }
    .bubble-text code {
      background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px;
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
    }
    .bubble-text pre {
      background: rgba(0,0,0,.06); padding: 8px 10px; border-radius: 6px;
      overflow-x: auto; margin: 8px 0;
    }
    .bubble-text pre code { background: none; padding: 0; }
    .bubble-text table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
    .bubble-text th, .bubble-text td {
      border: 1px solid var(--muted); padding: 4px 8px; text-align: left;
    }
    .bubble-text th { background: rgba(0,0,0,.05); font-weight: 700; }
    .bubble-text hr { border: none; border-top: 2px dashed var(--muted); margin: 10px 0; }
    .bubble-text a { color: var(--coral); text-decoration: underline; }
    .bubble-text strong { font-weight: 700; }
    .bubble-text blockquote {
      margin: 6px 0; padding: 2px 10px; border-left: 3px solid var(--muted); color: var(--muted);
    }

    /* ---------- ch04:可点引用角标 + 来源浮层 ---------- */
    .cite {
      cursor: pointer;
      color: var(--coral);
      font-weight: 700;
      font-size: 11px;
      vertical-align: super;
      line-height: 0;
      padding: 0 1px;
      border-bottom: 2px solid var(--coral);
      user-select: none;
    }
    .cite:hover { background: var(--coral); color: #fff; }
    .cite-pop {
      position: fixed;
      z-index: 50;
      background: var(--paper);
      border: 3px solid var(--ink);
      box-shadow: var(--shadow);
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.55;
      max-height: 50vh;
      overflow-y: auto;
    }
    .cite-pop-path {
      font-weight: 700; font-size: 12px; color: var(--coral);
      border-bottom: 2px dashed var(--muted); padding-bottom: 5px; margin-bottom: 6px;
      word-break: break-word;
    }
    .cite-pop-q { font-weight: 700; margin-bottom: 4px; }
    .cite-pop-a { color: var(--ink); white-space: pre-wrap; word-break: break-word; }
    .cite-pop-meta { margin-top: 7px; font-size: 11px; color: var(--muted); }

    /* ---------- ch04:每段回答满意度反馈(👍/👎) ---------- */
    .feedback { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .fb-btn {
      border: 2px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      width: 32px; height: 28px;
      display: grid; place-items: center;
      font-size: 14px; line-height: 1; padding: 0;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
      transition: transform .06s steps(1), box-shadow .06s steps(1), background .06s;
    }
    .fb-btn:hover:not(:disabled) { background: #ffedd6; }
    .fb-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
    .fb-btn.active { background: var(--coral); color: #fff; transform: translate(2px, 2px); box-shadow: none; }
    .fb-btn.dim { opacity: .4; }
    .fb-btn:disabled { cursor: default; }
    .fb-btn svg { width: 18px; height: 18px; display: block; image-rendering: auto; }
    .fb-done { font-size: 11px; color: var(--muted); letter-spacing: .3px; }

    /* typing indicator (blocky) */
    .typing { display: inline-flex; gap: 5px; padding: 3px 1px; }
    .typing span {
      width: 8px; height: 8px; background: var(--coral);
      animation: blink 1s steps(2) infinite;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: .25; } }

    /* ---------- empty state ---------- */
    .empty {
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 20px 12px;
      animation: pop .16s steps(3);
    }
    .empty .mascot {
      width: 96px; height: 96px; padding: 10px;
      border: 4px solid var(--ink);
      background: var(--paper);
      box-shadow: var(--shadow);
      margin-bottom: 12px;
    }
    .empty .mascot svg { width: 100%; height: 100%; display: block; }
    .empty h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: 1px; }
    .empty p { margin: 0; color: var(--muted); font-size: 13px; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; max-width: 440px; }
    .chip {
      border: 3px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      padding: 9px 14px;
      font-family: inherit;
      font-size: 12.5px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform .06s steps(1), box-shadow .06s steps(1), background .06s;
    }
    .chip:hover { background: #ffedd6; }
    .chip:active { transform: translate(3px, 3px); box-shadow: none; }

    /* ---------- ch05:actions 帧 - 转人工/建工单两独立按钮 ---------- */
    .action-bar { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .action-btn {
      border: 3px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      padding: 8px 14px;
      font-family: inherit;
      font-size: 12.5px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform .06s steps(1), box-shadow .06s steps(1), background .06s;
    }
    .action-btn:hover:not(:disabled) { background: #ffedd6; }
    .action-btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }
    .action-btn:disabled { background: #e8dcc8; color: var(--muted); cursor: not-allowed; }

    /* ---------- ch05:建工单表单弹窗 ---------- */
    .modal-mask {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(43, 38, 50, .45);
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-mask.open { display: flex; }
    .ticket-modal {
      width: 100%; max-width: 420px;
      background: var(--paper);
      border: 4px solid var(--ink);
      box-shadow: var(--shadow-lg);
      padding: 20px;
    }
    .ticket-modal h3 { margin: 0 0 4px; font-size: 16px; color: var(--ink); }
    .ticket-modal .sub { margin: 0 0 16px; font-size: 12px; color: var(--muted); }
    .ticket-field { margin-bottom: 14px; }
    .ticket-field label { display: block; font-size: 12.5px; margin-bottom: 6px; color: var(--ink); }
    .ticket-field label .req { color: var(--error); }
    .ticket-field select,
    .ticket-field textarea {
      width: 100%; font-family: inherit; font-size: 13px; color: var(--ink);
      border: 3px solid var(--ink); background: var(--cream);
      padding: 9px 10px; box-shadow: var(--shadow-sm);
    }
    .ticket-field textarea { resize: vertical; min-height: 88px; }
    .ticket-field select:focus,
    .ticket-field textarea:focus { outline: none; background: #fff; }
    .ticket-err { color: var(--error); font-size: 12px; min-height: 16px; margin: -6px 0 10px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .modal-actions button {
      border: 3px solid var(--ink); font-family: inherit; font-size: 13px;
      padding: 9px 16px; cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .modal-actions .cancel { background: var(--paper); color: var(--ink); }
    .modal-actions .cancel:hover { background: #ffedd6; }
    .modal-actions .submit { background: var(--coral); color: #fff; }
    .modal-actions .submit:hover:not(:disabled) { background: #ff6a45; }
    .modal-actions button:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }
    .modal-actions .submit:disabled { background: #e8dcc8; color: var(--muted); cursor: not-allowed; }
    /* ch06:退款表单只读订单号输入框 */
    .ticket-field input {
      width: 100%; font-family: inherit; font-size: 13px; color: var(--muted);
      border: 3px solid var(--ink); background: #efe6d4;
      padding: 9px 10px; box-shadow: var(--shadow-sm);
    }
    /* ch06:订单选择器卡片(interrupt 缺订单号时聊天流里点选) */
    .order-cards { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .order-card {
      text-align: left; border: 3px solid var(--ink); background: var(--cream);
      padding: 9px 11px; cursor: pointer; box-shadow: var(--shadow-sm);
      font-family: inherit; color: var(--ink);
    }
    .order-card:hover:not(:disabled) { background: #ffedd6; }
    .order-card:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }
    .order-card:disabled { cursor: not-allowed; opacity: .55; }
    .order-card.picked { background: #ffe0b3; opacity: 1; }
    .order-card .oc-top { font-size: 13px; font-weight: 700; }
    .order-card .oc-mid { font-size: 12.5px; margin-top: 2px; }
    .order-card .oc-bot { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

    /* ---------- ch08:工单预览确认卡(interrupt confirm_ticket) ---------- */
    .ticket-confirm {
      border: 3px solid var(--ink); background: var(--cream);
      padding: 10px 12px; margin-top: 10px; box-shadow: var(--shadow-sm);
    }
    .ticket-confirm .tc-title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .ticket-confirm .tc-row { font-size: 12.5px; margin-top: 3px; display: flex; gap: 6px; }
    .ticket-confirm .tc-label { color: var(--muted); flex: none; }
    .ticket-confirm .tc-btns { display: flex; gap: 8px; margin-top: 10px; }
    .ticket-confirm .tc-cancel { background: var(--paper); }
    .ticket-confirm.decided { opacity: .75; }
    /* 物流 Agent 的判定、证据与工具执行轨迹 */
    .decision-card {
      border: 3px solid var(--ink); background: #fff; padding: 10px 12px;
      margin-top: 10px; box-shadow: var(--shadow-sm); font-size: 12px; line-height: 1.6;
    }
    .decision-card strong { display: block; font-size: 13px; margin-bottom: 4px; }
    .decision-card .decision-reason { color: #64564e; white-space: pre-wrap; }
    .decision-card ul, .decision-card ol { margin: 5px 0 5px 16px; padding: 0; }
    .decision-card li { margin: 3px 0; }
    .decision-card details { margin-top: 7px; border-top: 1px dashed var(--muted); padding-top: 5px; }
    .decision-card summary { cursor: pointer; font-weight: 700; }
    .decision-card .decision-source { color: var(--muted); }

    /* ---------- composer ---------- */
    footer { padding: 14px 16px 16px; border-top: 4px solid var(--ink); background: var(--cream); }
    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--paper);
      border: 3px solid var(--ink);
      padding: 8px 8px 8px 14px;
      box-shadow: var(--shadow);
    }
    #input {
      flex: 1;
      resize: none;
      border: none;
      background: transparent;
      padding: 8px 0;
      font-size: 14.5px;
      font-family: inherit;
      line-height: 1.5;
      max-height: 128px;
      color: var(--ink);
    }
    #input:focus { outline: none; }
    #input::placeholder { color: var(--muted); }
    #send {
      flex: none;
      width: 44px; height: 44px;
      border: 3px solid var(--ink);
      background: var(--coral);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-sm);
      transition: transform .06s steps(1), box-shadow .06s steps(1);
    }
    #send:hover:not(:disabled) { background: #ff8b6d; }
    #send:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }
    #send:disabled { background: #d8cbc0; cursor: not-allowed; box-shadow: none; }
    #send svg { width: 22px; height: 22px; display: block; }
    .foot-note { text-align: center; color: var(--muted); font-size: 11px; margin: 10px 0 0; letter-spacing: .3px; }
    .auth-account { font-size: 12px; color: #111; max-width: 150px; overflow-wrap: anywhere; }
    .auth-account button, .auth-account a { color: #111; font: inherit; margin: 3px; }
    #loginMask { z-index: 1000; }
    #loginMask .ticket-field input { width: 100%; border: 2px solid var(--ink); padding: 10px; background: white; color: #111; font-size: 16px; }
    .run-summary { color: #36302b; font-size: 12px; padding-top: 8px; }
    .run-termination { color: #8e2030; border: 2px solid #8e2030; padding: 10px; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar">
      <div class="sb-head">会话记录</div>
      <div id="conv-list"></div>
    </aside>
    <div class="main">
    <header>
      <div class="avatar lg" data-cat></div>
      <div class="head-meta">
        <span class="name">小喵 · 智能客服</span>
        <span class="status"><span class="dot-online"></span>ONLINE · 喵喵优选</span>
      </div>
      <div class="spacer"></div>
      <div class="auth-account"><span id="account-name">未登录</span><br><a id="admin-link" href="/admin" hidden>管理页</a><button id="logout" type="button" hidden>退出</button></div>
      <button id="new-chat" type="button">＋ 新对话</button>
    </header>

    <div id="messages"></div>

    <footer>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="输入消息,和小喵聊聊吧~(回车发送 / Shift+回车换行)"></textarea>
        <button id="send" type="button" aria-label="发送">
          <svg viewBox="0 0 16 16" shape-rendering="crispEdges" fill="currentColor">
            <rect x="2" y="7" width="8" height="2"/><rect x="8" y="5" width="2" height="2"/>
            <rect x="8" y="9" width="2" height="2"/><rect x="10" y="3" width="2" height="2"/>

    // ---------- 轻量 markdown 渲染(零依赖,先转义再解析,防注入) ----------
    function escapeHtml(s) {
      return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }
    function renderInline(s) {
      s = s.replace(/`([^`]+)`/g, (m, c) => "<code>" + c + "</code>");
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
      s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
      // 仅允许 http(s) 链接,挡 javascript: 等
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return s;
    }
    function renderMarkdown(md) {
      const lines = escapeHtml(md).split("\n");
      const out = [];
      const isTableSep = (l) => l && l.includes("-") && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(l);
      const splitRow = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim());
      const isSpecial = (l, next) =>
        /^```/.test(l) || /^(#{1,6})\s/.test(l) || /^\s*[-*+]\s+/.test(l) ||
        /^\s*\d+\.\s+/.test(l) || /^\s*(---|\*\*\*|___)\s*$/.test(l) || /^\s*>\s?/.test(l) ||
        (l.includes("|") && isTableSep(next));
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        let m;
        if (/^```/.test(line)) {                                   // 代码块
          const buf = []; i++;
          while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
          i++;
          out.push("<pre><code>" + buf.join("\n") + "</code></pre>"); continue;
        }
        if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {               // 标题
          const n = m[1].length; out.push(`<h${n}>` + renderInline(m[2]) + `</h${n}>`); i++; continue;
        }
        if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { out.push("<hr>"); i++; continue; }  // 分隔线
        if (line.includes("|") && isTableSep(lines[i + 1])) {      // 表格
          const headers = splitRow(line); i += 2; const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
            rows.push(splitRow(lines[i])); i++;
          }
          let t = "<table><thead><tr>" + headers.map((c) => "<th>" + renderInline(c) + "</th>").join("") + "</tr></thead><tbody>";
          for (const r of rows) t += "<tr>" + r.map((c) => "<td>" + renderInline(c) + "</td>").join("") + "</tr>";
          out.push(t + "</tbody></table>"); continue;
        }
        if (/^\s*[-*+]\s+/.test(line)) {                           // 无序列表
          const items = [];
          while (i < lines.length && /^\s*[-*+]\s+/.test(lines[i])) {
            items.push("<li>" + renderInline(lines[i].replace(/^\s*[-*+]\s+/, "")) + "</li>"); i++;
          }
          out.push("<ul>" + items.join("") + "</ul>"); continue;
        }
        if (/^\s*\d+\.\s+/.test(line)) {                           // 有序列表
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push("<li>" + renderInline(lines[i].replace(/^\s*\d+\.\s+/, "")) + "</li>"); i++;
          }
          out.push("<ol>" + items.join("") + "</ol>"); continue;
        }
        if (/^\s*>\s?/.test(line)) {                               // 引用
          const buf = [];
          while (i < lines.length && /^\s*>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
          out.push("<blockquote>" + buf.map(renderInline).join("<br>") + "</blockquote>"); continue;
        }
        if (line.trim() === "") { i++; continue; }                 // 空行
        const para = [];                                           // 段落
        while (i < lines.length && lines[i].trim() !== "" && !isSpecial(lines[i], lines[i + 1])) {
          para.push(lines[i]); i++;
        }
        out.push("<p>" + para.map(renderInline).join("<br>") + "</p>");
      }
      return out.join("");
    }

    // ---------- ch04:引用角标 [n] → 可点,弹来源浮层(section_path + 原文) ----------
    let citePop = null;
    function ensureCitePop() {
      if (citePop) return citePop;
      citePop = document.createElement("div");
      citePop.className = "cite-pop";
      citePop.hidden = true;
      document.body.appendChild(citePop);
      document.addEventListener("click", (e) => {
        if (citePop.hidden) return;
        if (!citePop.contains(e.target) && !e.target.classList.contains("cite")) hideCitePop();
      });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideCitePop(); });
      window.addEventListener("resize", hideCitePop);
      return citePop;
    }
    function hideCitePop() { if (citePop) citePop.hidden = true; }
    function showCitePop(sup, c) {
      const pop = ensureCitePop();
      pop.innerHTML =
        '<div class="cite-pop-path">' + escapeHtml(c.section_path || "来源") + "</div>" +
        (c.question ? '<div class="cite-pop-q">' + escapeHtml(c.question) + "</div>" : "") +
        '<div class="cite-pop-a">' + escapeHtml(c.answer || "") + "</div>" +
        '<div class="cite-pop-meta">来源编号 [' + c.n + "]" +
        (c.content_type ? " · " + escapeHtml(c.content_type) : "") + "</div>" +
        ((c.content_type === "policy" || (c.policy_source && c.policy_source.version)) ? '<div class="cite-pop-meta">' +
        (c.policy_source && c.policy_source.version
          ? "政策 " + escapeHtml(c.policy_source.policy_id || "") + " · 版本 " + escapeHtml(c.policy_source.version)
          : "政策版本尚未核验") + "</div>" : "");
      pop.hidden = false;
      // 定位:角标下方,超出视口右/下边则回收
      const r = sup.getBoundingClientRect();
      const pw = Math.min(320, window.innerWidth - 24);
      pop.style.width = pw + "px";
      let left = Math.min(r.left, window.innerWidth - pw - 12);
      let top = r.bottom + 6;
      if (top + pop.offsetHeight > window.innerHeight - 12) top = Math.max(12, r.top - pop.offsetHeight - 6);
      pop.style.left = Math.max(12, left) + "px";
      pop.style.top = top + "px";
    }
    function decorateCitations(container, citations) {
      const byN = new Map(citations.map((c) => [String(c.n), c]));
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const targets = [];
      let node;
      while ((node = walker.nextNode())) {
        if (node.parentElement.classList.contains("cite")) continue;
        if (/\[\d+\]/.test(node.nodeValue)) targets.push(node);
      }
      for (const textNode of targets) {
        const frag = document.createDocumentFragment();
        let last = 0;
        const re = /\[(\d+)\]/g;
        let m;
        while ((m = re.exec(textNode.nodeValue))) {
          const c = byN.get(m[1]);
          if (!c) continue;  // 非有效编号,保留原文
          if (m.index > last) frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last, m.index)));
          const sup = document.createElement("sup");
          sup.className = "cite";
          sup.textContent = "[" + m[1] + "]";
          sup.title = c.section_path || "查看来源";
          sup.addEventListener("click", (e) => { e.stopPropagation(); showCitePop(sup, c); });
          frag.appendChild(sup);
          last = m.index + m[0].length;
        }
        if (last > 0) {
          if (last < textNode.nodeValue.length) frag.appendChild(document.createTextNode(textNode.nodeValue.slice(last)));
          textNode.parentNode.replaceChild(frag, textNode);
        }
      }
    }

    // ---------- ch04:每段回答满意度反馈(👍/👎,点一次点亮 + 已反馈,一次性)----------
    function addFeedbackBar(bubble) {
      if (bubble.querySelector(".feedback")) return;   // 防重复挂
      const bar = document.createElement("div");
      bar.className = "feedback";
      const up = document.createElement("button");
      up.type = "button"; up.className = "fb-btn"; up.innerHTML = THUMB_UP_SVG;
      up.setAttribute("aria-label", "这条回答有帮助");
      const down = document.createElement("button");
      down.type = "button"; down.className = "fb-btn"; down.innerHTML = THUMB_DOWN_SVG;
      down.setAttribute("aria-label", "这条回答没帮助");
      const done = document.createElement("span");
      done.className = "fb-done"; done.hidden = true; done.textContent = "已反馈,谢谢~";
      bar.append(up, down, done);
      // ch09:向上找这条回答之前最近的用户气泡,把该轮用户原话带给后端(👎 落池要用)
      function userQuestionBefore() {
        let row = bubble.closest(".row");
        while (row && (row = row.previousElementSibling)) {
          if (row.classList && row.classList.contains("user")) {
            const b = row.querySelector(".bubble");
            return (b ? b.textContent : row.textContent).trim();
          }
        }
        return "";
      }
      function give(chosen, other) {
        if (bar.dataset.given) return;   // 一次性,点过不再变
        bar.dataset.given = "1";
        chosen.classList.add("active");  // 点亮选中的
        other.classList.add("dim");      // 另一个淡出
        up.disabled = true; down.disabled = true;
        done.hidden = false;             // 显示"已反馈"
        // ch09:反馈接后端——👎 落低置信度问题池进飞轮,👍 后端只记日志;失败静默,UI 行为不变
        fetch("/api/feedback", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ conversation_id: getConversationId(),
                                 rating: chosen === down ? "down" : "up",
                                 question: userQuestionBefore() }),
        }).catch(() => {});
      }
      up.addEventListener("click", () => give(up, down));
      down.addEventListener("click", () => give(down, up));
      bubble.appendChild(bar);
    }

    // ---------- ch05:actions 帧 - 转人工/建工单两按钮交互 ----------
    function renderActions(bubble, items) {
      const bar = document.createElement("div");
      bar.className = "action-bar";
      for (const a of items) {
        if (a.type === "select_order") {
          // ch08:报了不属于自己的订单号被拒,把他名下的单列出来点选。拒绝之后得给条出路,
          // 否则用户既查不到,也不知道自己的单号是多少
          renderOrderCards(bubble, a.orders || [], pickThenAsk);
          continue;
        }
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "action-btn";
        if (a.type === "transfer_human") {
          btn.textContent = "人工核实建议";
          btn.addEventListener("click", () => {
            btn.disabled = true;
            const sys = addRow("bot");
            sys.textContent = "请通过平台人工客服渠道继续核实，可以提供本次问题描述与查询证据。当前未自动提交处理申请。";
            messagesEl.scrollTop = messagesEl.scrollHeight;
          });
        } else if (a.type === "create_ticket") {
          btn.textContent = "工单入口待完善";
          btn.disabled = true;
          btn.title = "当前提供问题草稿与核验依据，尚未接入工单提交";
        } else if (a.type === "refund_form") {

    // 读一条 SSE 流,按帧分发到 on.{delta,tool,citations,actions,interrupt};done 存 conversation_id;event: error 抛错
    async function readSSEStream(resp, on) {
      if (!resp.ok || !resp.body) {
        let message = "请求未成功，请稍后重试";
        try { const body = await resp.json(); if (typeof body.detail === "string") message = body.detail; } catch (_) {}
        throw new Error(message);
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) throw new Error("连接已中断，回复尚未完整接收。请核实状态后重试。");
        buffer += decoder.decode(value, { stream: true });
        const frames = buffer.split("\n\n");
        buffer = frames.pop() ?? "";
        for (const frame of frames) {
          const line = frame.split("\n").find((l) => l.startsWith("data: "));
          if (!line) continue;
          const payload = line.slice(6);
          if (payload === "[DONE]") return;
          const data = JSON.parse(payload);
          if (frame.startsWith("event: error")) throw new Error(data.message || "本轮处理未成功");
          if (data.event === "tool") on.tool && on.tool(data.name, data.ok);
          else if (data.event === "logistics_decision") on.logisticsDecision && on.logisticsDecision(data);
          else if (data.event === "citations") on.citations && on.citations(data.items || []);
          else if (data.event === "interrupt") {
            if (data.conversation_id) setConversationId(data.conversation_id);  // 中断无 done 帧,靠这里记会话号供续跑
            on.interrupt && on.interrupt(data);
          }
          else if (data.event === "actions") on.actions && on.actions(data.items || []);
          else if (data.event === "termination") {
            if (data.conversation_id) setConversationId(data.conversation_id);
            on.termination && on.termination(data);
          }
          else if (data.event === "execution_summary") on.executionSummary && on.executionSummary(data);
          else if (data.event === "done") setConversationId(data.conversation_id);
          else if (data.delta !== undefined) on.delta && on.delta(data.delta);
        }
      }
    }

    // 把一次 SSE 流(/api/chat 首轮 或 /api/actions/resume 续跑)渲染进 bubble;
    // 遇 interrupt 按 kind 分发:select_order 渲染订单卡点选,confirm_ticket 渲染工单预览卡
    // (确认提交/取消),两者都在用户操作后开新气泡续跑。
    async function streamInto(bubble, doFetch) {
      showTyping(bubble);
      let structured = false, textStarted = false, interrupted = false, terminated = false, hasDecision = false, raw = "";
      let badgesEl = null, textEl = null, citations = [], actions = [];
      function ensureStructure() {
        if (structured) return;
        bubble.innerHTML = "";
        badgesEl = document.createElement("div");
        badgesEl.className = "tool-badges";
        textEl = document.createElement("div");
        textEl.className = "bubble-text";
        bubble.appendChild(badgesEl);
        bubble.appendChild(textEl);
        showTyping(textEl);
        structured = true;
      }
      const resp = await doFetch();
      await readSSEStream(resp, {
        delta: (delta) => {
          ensureStructure();
          if (!textStarted) { textEl.innerHTML = ""; textStarted = true; }
          raw += delta;
          textEl.innerHTML = renderMarkdown(raw);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        },
        tool: (toolName, ok) => {
          ensureStructure();
          const b = document.createElement("div");
          b.className = "tool-badge";
          b.textContent = (ok === false ? "🔧 查询未完成：" : "🔧 查询结果：") + toolName;
          badgesEl.appendChild(b);
          messagesEl.scrollTop = messagesEl.scrollHeight;
        },
        logisticsDecision: (decision) => {
          ensureStructure();
          if (!textStarted && textEl) textEl.innerHTML = "";
          hasDecision = true;
          renderLogisticsDecision(bubble, decision);
        },
        citations: (items) => { citations = items; },
        actions: (items) => { actions = items; },
        termination: (data) => {
          ensureStructure();
          if (!textStarted && textEl) textEl.innerHTML = "";
          terminated = true;
          const notice = document.createElement("div");
          notice.className = "run-termination";
          notice.textContent = data.message || "本轮已停止，请补充信息或稍后重试。";
          bubble.appendChild(notice);
        },
        executionSummary: (data) => {
          ensureStructure();
          const note = document.createElement("div");
          note.className = "run-summary";
          const elapsed = data.elapsed_ms ?? data.duration_ms;
          const model = data.model_calls ?? data.model_call_count;
          const tools = data.tool_calls ?? data.tool_call_count;
          const parts = [];
          if (typeof elapsed === "number") parts.push("耗时 " + (elapsed / 1000).toFixed(1) + " 秒");
          if (typeof model === "number") parts.push("模型 " + model + " 次");
          if (typeof tools === "number") parts.push("工具 " + tools + " 次");
          note.textContent = parts.join(" · ");
          if (parts.length) bubble.appendChild(note);
        },
        interrupt: (data) => {
          interrupted = true;
          if (structured && !textStarted && textEl) textEl.innerHTML = "";
          if (!structured) { bubble.innerHTML = ""; structured = true; }
          // ch08:中断按 kind 分发——select_order 弹订单卡,confirm_ticket 弹工单预览卡
          if (data.kind === "confirm_ticket") renderTicketConfirm(bubble, data.preview || {});
          else renderOrderCards(bubble, data.orders || []);
        },
      });
      if (interrupted) return;
      if (terminated) return;
      if (!textStarted) { ensureStructure(); textEl.innerHTML = ""; textEl.textContent = hasDecision ? "物流分析已完成。" : "(无回复)"; }
      if (textStarted && citations.length) decorateCitations(textEl, citations);
      if (actions.length) renderActions(bubble, actions);
      if (textStarted) addFeedbackBar(bubble);
    }

    async function send(preset) {
      if (!currentUser || sendBtn.disabled) return;
      const message = (preset ?? inputEl.value).trim();
      if (!message) return;
      inputEl.value = "";
      autoGrow();
      addRow("user").textContent = message;
      setBusy(true);
      const bubble = addRow("bot");
      try {
        await streamInto(bubble, () => fetch("/api/chat", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, conversation_id: getConversationId() }),
        }));
      } catch (err) {
        bubble.className = "bubble error";
        bubble.textContent = err.message || "回复失败,请稍后重试";
      } finally {
        setBusy(false);
        loadConversations();   // ch07:每轮后刷新侧栏(新会话入列/摘要标记更新)
      }
    }

    async function switchConversation(cid) {
      // 已是当前会话且聊天区有内容才跳过;页面刚刷新时聊天区是空的,点当前会话也要回载
      if (cid === getConversationId() && messagesEl.querySelector(".row")) return;
      setConversationId(cid);
      messagesEl.innerHTML = "";
      try {
        const r = await fetch("/api/conversations/" + cid + "/messages");
        if (r.ok) {
          for (const m of ((await r.json()).items || [])) {
            if (!m.content) continue;
            if (m.role === "user") {
              addRow("user").textContent = m.content;
            } else {
              const bubble = addRow("bot");
              const textEl = document.createElement("div");
              textEl.className = "bubble-text";
              textEl.innerHTML = renderMarkdown(m.content);
              bubble.appendChild(textEl);
              const hit = REPLAY_ACTIONS.find((ra) => m.content.trim() === ra.text);
              if (hit) renderActions(bubble, hit.actions);
              addFeedbackBar(bubble);   // 反馈条(👍/👎)回载也要有,和直播轮一致
            }
          }
        }
      } catch (e) { /* 历史加载失败仍可继续聊 */ }
      if (!messagesEl.children.length) renderEmptyState();
      messagesEl.scrollTop = messagesEl.scrollHeight;
      loadConversations();   // 刷新 active 高亮
      inputEl.focus();
    }

    function autoGrow() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 128) + "px";
    }

    sendBtn.addEventListener("click", () => send());
    inputEl.addEventListener("input", autoGrow);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    newChatBtn.addEventListener("click", () => {
      clearConversationId();          // 开新会话:丢弃当前 conversation_id(旧会话仍在侧栏可切回)
      renderEmptyState();
      loadConversations();            // 清 active 高亮
      inputEl.focus();
    });

    async function initIdentity() {
      setBusy(true);
      try {
        const response = await fetch("/api/auth/me");
        if (!response.ok) { showLogin(); return; }
        const principal = await response.json();
        enterChat(principal);
      } catch (_) { showLogin(); }
    }
    initIdentity();
  </script>
</body>
</html>
